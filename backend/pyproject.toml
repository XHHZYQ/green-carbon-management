[project]
name = "green-carbon-backend"
version = "1.0.0"
description = "绿色低碳智慧管控系统 后端服务"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.2",
    "pillow>=10.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
